publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2
  flutter: ^3.44.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8
  cross_file: 0.3.5+4
  file_selector: 1.1.0
  flutter_secure_storage: 10.3.1
  doc_scan_lite: ^0.0.2
