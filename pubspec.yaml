  http: 1.6.0
  image_picker: 1.2.3
  intl: 0.20.3
  image: ^4.10.0
  open_filex: ^4.7.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
